[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valcoach"
version = "0.1.0"
description = "Local evidence queries over vrfkit replay exports"
requires-python = ">=3.11"
dependencies = ["pyarrow>=25,<26"]

[project.scripts]
valcoach = "valcoach.__main__:main"

[tool.setuptools.packages.find]
include = ["valcoach*"]

[tool.setuptools.package-data]
valcoach = ["mapdata/*.json"]
